name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    env:
      CI: true
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Check for migration drift
        run: npm run migration:check

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: npm audit
        run: npm audit --audit-level=high

      - name: Verify registry signatures
        run: npm audit signatures

  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.3 \
            git /repo --no-banner --redact --gitleaks-ignore-path /repo/.gitleaksignore

  sast:
    name: Static Analysis
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.130.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Semgrep
        run: |
          semgrep scan \
            --config p/typescript \
            --config p/expressjs \
            --config p/jwt \
            --config p/secrets \
            --severity ERROR \
            --exclude tests \
            --metrics=off \
            --error

  image-scan:
    name: Container Image Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t supportpro-backend:ci .

      - name: Trivy
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.65.0 \
            image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            supportpro-backend:ci

  commitlint:
    name: Commit Lint
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint commit messages
        uses: wagoid/commitlint-github-action@v6

      - name: Reject empty commits
        run: |
          set -euo pipefail
          RANGE="origin/${{ github.base_ref }}...HEAD"
          empty="$(
            git rev-list --no-merges "$RANGE" |
            while read -r sha; do
              parent="$(git rev-parse "${sha}^" 2>/dev/null || true)"
              [ -n "$parent" ] || continue
              if git diff-tree --quiet "$parent" "$sha"; then
                printf '%s %s\n' "$sha" "$(git log -1 --format='%s' "$sha")"
              fi
            done
          )"
          if [ -n "$empty" ]; then
            echo "Empty commit(s) in this PR (zero diff vs parent):"
            echo "$empty"
            echo
            echo "These survive rebases by default and pollute every subsequent PR."
            echo "Drop them with: git rebase --no-keep-empty origin/${{ github.base_ref }}"
            exit 1
          fi
