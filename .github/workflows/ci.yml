name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    env:
      CI: true
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Check for migration drift
        run: npm run migration:check

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: npm audit
        run: npm audit --audit-level=high

  commitlint:
    name: Commit Lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint commit messages
        uses: wagoid/commitlint-github-action@v6

      - name: Reject empty commits
        run: |
          set -euo pipefail
          RANGE="origin/${{ github.base_ref }}...HEAD"
          empty="$(
            git rev-list --no-merges "$RANGE" |
            while read -r sha; do
              parent="$(git rev-parse "${sha}^" 2>/dev/null || true)"
              [ -n "$parent" ] || continue
              if git diff-tree --quiet "$parent" "$sha"; then
                printf '%s %s\n' "$sha" "$(git log -1 --format='%s' "$sha")"
              fi
            done
          )"
          if [ -n "$empty" ]; then
            echo "Empty commit(s) in this PR (zero diff vs parent):"
            echo "$empty"
            echo
            echo "These survive rebases by default and pollute every subsequent PR."
            echo "Drop them with: git rebase --no-keep-empty origin/${{ github.base_ref }}"
            exit 1
          fi
