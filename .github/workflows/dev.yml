name: Deploy to EC2

on:
  push:
    branches:
      - main  # Trigger on push to main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # Checkout the code from the repository
    - name: Checkout code
      uses: actions/checkout@v2

    # Set up SSH key to access EC2
    - name: Set up SSH key
      uses: webfactory/ssh-agent@v0.5.3
      with:
        ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

    # Install SSH client on the runner
    - name: Install SSH client
      run: sudo apt-get install -y openssh-client

    # Deploy to EC2 without running any dependencies
    - name: Deploy to EC2 (Checkout Code)
      run: |
        ssh -o StrictHostKeyChecking=no -i /tmp/private_key ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
          cd /home/ubuntu/supportpro || exit 1
          git pull origin main || exit 1
        EOF
      env:
        EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
        EC2_PUBLIC_IP: ${{ secrets.EC2_HOST }}
