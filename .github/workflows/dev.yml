name: Deploy to DigitalOcean Droplet

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to DigitalOcean Droplet
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout the repository from git
    - name: Checkout code
      uses: actions/checkout@v3

    # Step 2: Set up SSH to access the Droplet
    - name: Set up SSH
      uses: webfactory/ssh-agent@v0.7.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    # Step 3: Deploy the application
    - name: Deploy to Droplet
      run: |
        ssh -o StrictHostKeyChecking=no root@167.172.8.238 << 'EOF'
          # Navigate to the project directory
          cd /home/supportpro/supportpro.backend || exit 1
          
          # Pull the latest changes
          git pull origin main

          # Build the application 
          npm install
          npm run build

          # Restart the service 
          pm2 restart app.js || pm2 start /home/supportpro/supportpro.backend/dist --name "supportpro"
        EOF
