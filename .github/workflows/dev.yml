name: Deploy to EC2

on:
  push:
    branches:
      - main  # Deploy on pushes to the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # Checkout the code from the repository
    - name: Checkout code
      uses: actions/checkout@v2

    # Set up SSH keys to access EC2
    - name: Set up SSH key
      uses: webfactory/ssh-agent@v0.5.3
      with:
        ssh-private-key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}

    # Install SSH client on the runner
    - name: Install SSH client
      run: sudo apt-get install -y openssh-client

    # Deploy to EC2 instance
    - name: Deploy to EC2
      run: |
        # Connect to EC2, pull the latest code, install dependencies, and restart app
        ssh -o StrictHostKeyChecking=no -i /tmp/private_key ubuntu@${{ secrets.EC2_PUBLIC_IP }} << 'EOF'
          cd /home/ubuntu/supportpro || exit 1
          git pull origin main || exit 1
          npm install --production || exit 1
          pm2 restart supportpro || pm2 start dist/app.js --name supportpro
        EOF
      env:
        EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        EC2_PUBLIC_IP: ${{ secrets.EC2_PUBLIC_IP }}
