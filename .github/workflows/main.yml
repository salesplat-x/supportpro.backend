name: Continuous Build and Deployment Engine

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: salesplat/supportpro-backend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH to Droplet
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DIGITAL_OCEAN_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail

            cd ~/app-stack

            echo "==> Pulling latest image"
            docker pull salesplat/supportpro-backend:latest

            # Gate the cutover: migrations must succeed while the old container
            # is still serving. If this fails, we abort and leave production alone.
            echo "==> Running migrations (must succeed before server restart)"
            docker run --rm \
              --network app-network \
              --env-file .env \
              --entrypoint node \
              salesplat/supportpro-backend:latest \
              dist/scripts/migrate.js

            echo "==> Seeding admin (no-op if already present)"
            docker run --rm \
              --network app-network \
              --env-file .env \
              --entrypoint node \
              salesplat/supportpro-backend:latest \
              dist/scripts/seedAdmin.js

            echo "==> Replacing running server"
            docker stop supportpro-backend || true
            docker rm supportpro-backend || true

            # Entrypoint runs migrations again before listen (idempotent safety net
            # for restarts / manual runs). Deploy already gated above.
            docker run -d \
              --name supportpro-backend \
              --network app-network \
              -p 8000:8000 \
              --env-file .env \
              --restart always \
              salesplat/supportpro-backend:latest

            echo "==> Deploy complete"
