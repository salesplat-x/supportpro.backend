name: Continuous Build and Deployment Engine

# Deploys only a commit that passed CI, by its exact SHA. The droplet runs
# scripts/deploy.sh (tested in tests/deploy.test.ts): it health-checks the new
# release and rolls back to the previous image if it is unhealthy. :latest on
# Docker Hub moves only after a healthy deploy, so it always means "last good".
#
# Manual redeploy / rollback: Actions → this workflow → "Run workflow" with the
# full SHA of a commit whose image was already built here.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "Full 40-character commit SHA of an already-built image to (re)deploy"
        required: true
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: salesplat/supportpro-backend
  DEPLOY_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.event.workflow_run.head_sha }}

jobs:
  build-and-push:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # Only the immutable commit tag is pushed here; :latest is promoted after the health check.
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            GIT_SHA=${{ env.DEPLOY_SHA }}
          tags: |
            salesplat/supportpro-backend:${{ env.DEPLOY_SHA }}

  deploy:
    needs: build-and-push
    # Runs after a successful build, or on a manual run (where the build is skipped).
    if: >-
      always() &&
      (needs.build-and-push.result == 'success' ||
      (github.event_name == 'workflow_dispatch' && needs.build-and-push.result == 'skipped'))
    runs-on: ubuntu-latest
    steps:
      # A manual run uses main's deploy script even when redeploying an older image.
      - name: Checkout deploy script
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Check the SHA
        run: |
          if ! printf '%s' "${DEPLOY_SHA}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::DEPLOY_SHA must be a full 40-character commit SHA (got '${DEPLOY_SHA}')"
            exit 1
          fi
          echo "Deploying ${IMAGE}:${DEPLOY_SHA}"

      - name: Deploy via SSH to Droplet
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_SHA: ${{ env.DEPLOY_SHA }}
        with:
          host: ${{ secrets.DIGITAL_OCEAN_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 15m
          envs: DEPLOY_SHA
          script_path: scripts/deploy.sh

  promote-latest:
    needs: deploy
    if: always() && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Point :latest at the release that just passed its health check
        run: |
          docker buildx imagetools create \
            --tag "salesplat/supportpro-backend:latest" \
            "salesplat/supportpro-backend:${DEPLOY_SHA}"
