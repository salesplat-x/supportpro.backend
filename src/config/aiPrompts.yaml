    - key: task_jobBrief
      label: "Task: job brief"
      text: "Write the job brief: what the candidate reads first. Plain text with section headers such as 'About the Role:', 'Responsibilities:' and 'Benefits:', under 600 words. Only list benefits the job's fields name."
    - key: task_requirements
