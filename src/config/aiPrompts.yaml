      text: "Write private notes for an AI grader describing what a strong hire looks like for this job: must-have skills, experience bar, and red flags. 4 to 8 short plain-text lines. Candidates never see this."
    - key: task_skills
      label: "Task: skills"
      text: Suggest up to 8 additional skills a strong candidate needs. Each is 1 to 4 words. Do not repeat skills already listed.
    - key: task_goals
      label: "Task: goals"
      text: Suggest up to 5 goals the new hire should achieve in their first year. Each is one short sentence with something you could measure. Do not repeat goals already listed.
    - key: rich_task_jobBrief
      label: "Task: job brief (rich text)"
      text: "Write the job brief: what the candidate reads first. Use section headers such as 'About the Role', 'Responsibilities' and 'Benefits', under 600 words. Only list benefits the job's fields name."
    - key: rich_task_requirements
      label: "Task: requirements (rich text)"
      text: Write the requirements section, with section headers such as 'Qualifications' and 'Nice to Have', keeping must-haves apart from nice-to-haves.
