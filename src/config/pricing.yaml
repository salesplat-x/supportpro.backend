# Single source of truth for recruiter pricing, features, and comparison.
# Amounts are in NGN (naira) for Paystack billing. USD fields are display-only
# on the marketing pricing UI (monthlyAmountUsd / yearlyAmountUsd).
# Real Paystack plan codes for the subscription tiers are stored on the DB-backed
# `plans` table (see src/entities/Plan.ts / src/services/planSync.ts) — this file
# describes the marketing catalogue, not the checkout mechanics.

currency: NGN
currencySymbol: "₦"
yearlyDiscountPercent: 20
guarantee: "14-day money back guarantee"
cancelAnytime: "Cancel anytime"

hero:
  kicker: PRICING
  title: Simple, transparent pricing
  subtitle: Simple, transparent pricing that grows with you. Try any plan free for 30 days.

