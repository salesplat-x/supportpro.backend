# Update this file from each provider's official models page, then run `npm run ai:smoke`.
verifiedOn: "2026-11-24"
# pricing: USD per 1M tokens from each provider's official pricing page, standard tier, prompts under
# 200k tokens. DeepSeek charges half outside peak hours; the peak price is used so costs never read low.
# A model without pricing shows its cost as unknown on the admin AI usage page.
pricesVerifiedOn: "2026-11-25"

providers:
  - key: openai
    name: OpenAI
    envKey: OPENAI_API_KEY
    baseUrl: https://api.openai.com/v1
    docsUrl: https://developers.openai.com/api/docs/models
    attemptTimeoutMs: 30000
  - key: gemini
    name: Google Gemini
    envKey: GEMINI_API_KEY
    baseUrl: https://generativelanguage.googleapis.com/v1beta/openai/
    docsUrl: https://aistudio.google.com/docs/models
    attemptTimeoutMs: 30000
  - key: grok
    name: xAI Grok
    envKey: GROK_API_KEY
    baseUrl: https://api.x.ai/v1
    docsUrl: https://docs.x.ai/docs/models
    attemptTimeoutMs: 30000
  - key: groq
    name: Groq
    envKey: GROQ_API_KEY
    baseUrl: https://api.groq.com/openai/v1
    docsUrl: https://console.groq.com/docs/models
    attemptTimeoutMs: 30000
  - key: deepseek
    name: DeepSeek
    envKey: DEEPSEEK_API_KEY
    baseUrl: https://api.deepseek.com
    docsUrl: https://api-docs.deepseek.com/quick_start/pricing
    attemptTimeoutMs: 30000

# USD per minute of audio for the voice assistant's speech-to-text, which isn't a chat or embedding model.
audioPricing:
  - { provider: openai, model: whisper-1, perMinute: 0.006 }

# tokenParam: the request field that caps output on this model.
# supportsTemperature: false means the temperature field is dropped from the request.
# reasoningEffort: sent as reasoning_effort. Absent means the field is left out.
# minOutputTokens: reasoning uses up the output cap, so short caps are raised to this floor.
# retiresOn: the model stays selectable only for features already using it.
models:
  - id: gpt-6-astra
    provider: openai
    label: GPT-6 Astra
    kind: chat
    pricing: [{ inputPerMillion: 10, outputPerMillion: 50 }]
    formats: [json_object, json_schema]
    tokenParam: max_completion_tokens
    supportsTemperature: false
    reasoningEffort: low
    minOutputTokens: 4000
  - id: gpt-6.1-sol
    provider: openai
    label: GPT-6.1 Sol
    kind: chat
    pricing: [{ inputPerMillion: 2, outputPerMillion: 10 }]
    formats: [json_object, json_schema]
    tokenParam: max_completion_tokens
    supportsTemperature: false
    reasoningEffort: low
    minOutputTokens: 4000
  - id: gpt-6.1-terra
    provider: openai
    label: GPT-6.1 Terra
    kind: chat
    pricing: [{ inputPerMillion: 1, outputPerMillion: 5 }]
    formats: [json_object, json_schema]
    tokenParam: max_completion_tokens
    supportsTemperature: true
    reasoningEffort: none
