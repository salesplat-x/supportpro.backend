services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-postgres}
      POSTGRES_DB: ${PG_DB:-supportpro}
    ports:
      - "${PG_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-postgres} -d ${PG_DB:-supportpro}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgbouncer:
    image: bitnamilegacy/pgbouncer:1.24.1-debian-12-r10
    restart: unless-stopped
    environment:
      - POSTGRESQL_HOST=postgres
      - POSTGRESQL_PORT=5432
      - POSTGRESQL_USERNAME=${PG_USER:-postgres}
      - POSTGRESQL_PASSWORD=${PG_PASSWORD:-postgres}
      - POSTGRESQL_DATABASE=${PG_DB:-supportpro}
      - PGBOUNCER_DATABASE=${PG_DB:-supportpro}
      - PGBOUNCER_POOL_MODE=transaction
      - PGBOUNCER_MAX_CLIENT_CONN=1000
      - PGBOUNCER_DEFAULT_POOL_SIZE=20
      - PGBOUNCER_AUTH_TYPE=plain
    ports:
      - "${PG_BOUNCER_PORT:-5433}:6432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "PGPASSWORD=$$POSTGRESQL_PASSWORD /opt/bitnami/postgresql/bin/psql -h 127.0.0.1 -p 6432 -U $$POSTGRESQL_USERNAME -d $$POSTGRESQL_DATABASE -c 'SELECT 1'",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: salesplat/supportpro-backend:${IMAGE_TAG:-latest}
    build: .
    env_file:
      - .env
    environment:
      - PG_HOST=pgbouncer
      - PG_PORT=6432
    command: ["node", "dist/scripts/migrate.js"]
    depends_on:
      pgbouncer:
        condition: service_healthy

  app:
    image: salesplat/supportpro-backend:${IMAGE_TAG:-latest}
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      # Route through pgbouncer so the app's TypeORM pool doesn't open
      # connections directly against Postgres. Bitnami's pgbouncer image
      # listens on 6432 internally, not 5432.
      - PG_HOST=pgbouncer
      - PG_PORT=6432
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
