<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to AuxHR</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 600px;
            margin: 20px auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .header {
            text-align: center;
            padding: 20px;
        }

        .header img {
            max-width: 150px;
        }

        .content {
            text-align: center;
            padding: 20px;
        }

        .cta-button {
            display: inline-block;
            padding: 10px 20px;
            margin-top: 20px;
            background-color: #007bff;
            color: #ffffff;
            text-decoration: none;
            font-size: 16px;
            border-radius: 5px;
        }

        .footer {
            text-align: center;
            font-size: 12px;
            color: #666;
            padding: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <img src="https://yourlogo.com/logo.png" alt="AuxHR Logo">
            <h2>Welcome to AuxHR!</h2>
        </div>
        <div class="content">
            <p>Hi {{firstName}},</p>
            <p>We're excited to have you join <strong>AuxHR</strong>, where opportunities meet top talent. Our platform
                is designed to connect you with the best career opportunities.</p>
            <p>Start exploring job openings, connecting with recruiters, and building your career today!</p>
            <!-- <a href="https://auxhr.com/dashboard" class="cta-button">Get Started</a> -->
        </div>
        <!-- <div class="footer">
            <p>Need help? Contact our support team at <a href="mailto:support@auxhr.com">support@auxhr.com</a></p>
            <p>&copy; 2025 AuxHR. All rights reserved.</p>
        </div> -->
    </div>
</body>

</html>
