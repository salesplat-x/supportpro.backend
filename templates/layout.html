<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>{{title}}</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #f4f5f7;
        color: #3f3f46;
        font-family: Arial, Helvetica, sans-serif;
      }
      .preheader {
        display: none !important;
        visibility: hidden;
        opacity: 0;
        color: transparent;
        height: 0;
        width: 0;
        overflow: hidden;
        mso-hide: all;
      }
      .wrap {
        width: 100%;
        background-color: #f4f5f7;
        padding: 32px 16px;
      }
      .card {
        width: 100%;
        max-width: 560px;
        margin: 0 auto;
        background-color: #ffffff;
        border: 1px solid #e4e7ec;
      }
      .header {
        padding: 20px 32px;
        background-color: #1e2a4d;
        text-align: left;
      }
      .header img {
        height: 24px;
        width: auto;
        display: block;
        border: 0;
      }
      .content {
        padding: 32px;
      }
      h1 {
        margin: 0 0 16px;
        font-size: 22px;
        line-height: 1.35;
        font-weight: 600;
        color: #101828;
      }
      p {
        margin: 0 0 14px;
        font-size: 15px;
        line-height: 1.6;
        color: #4b4b4b;
      }
      .muted {
        color: #667085;
        font-size: 14px;
      }
      .button {
        display: inline-block;
        margin: 8px 0 20px;
        padding: 12px 22px;
        background-color: #1e2a4d;
        color: #ffffff !important;
        text-decoration: none;
        font-size: 14px;
        font-weight: 600;
        border-radius: 4px;
      }
      .otp {
        margin: 16px 0 20px;
        padding: 14px 18px;
        background-color: #f4f5f7;
        border: 1px solid #e4e7ec;
        font-size: 22px;
        letter-spacing: 0.16em;
        font-weight: 700;
        color: #101828;
        text-align: center;
      }
      .rows {
        width: 100%;
        border-collapse: collapse;
        margin: 8px 0 20px;
      }
      .rows td {
        padding: 10px 0;
        font-size: 14px;
        border-bottom: 1px solid #eef0f3;
        vertical-align: top;
      }
      .rows tr:last-child td {
        border-bottom: none;
      }
      .label {
        color: #667085;
        width: 42%;
      }
      .value {
        color: #101828;
        font-weight: 600;
        text-align: right;
      }
      .signoff {
        margin-top: 8px;
      }
      .footer {
        padding: 18px 32px 24px;
        font-size: 12px;
        line-height: 1.5;
        color: #667085;
        border-top: 1px solid #eef0f3;
      }
      .footer a {
        color: #667085;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    {{#if preheader}}
    <div class="preheader">{{preheader}}</div>
    {{/if}}
    <div class="wrap">
      <table class="card" role="presentation" cellpadding="0" cellspacing="0" width="100%">
        <tr>
          <td class="header">
            <img src="{{logoUrl}}" alt="Auxhr" />
          </td>
        </tr>
        <tr>
          <td class="content">{{{body}}}</td>
        </tr>
        <tr>
          <td class="footer">
            Auxhr ·
            <a href="mailto:support@auxhr.com">support@auxhr.com</a><br />
            &copy; 2026 Auxhr. All rights reserved.
          </td>
        </tr>
      </table>
    </div>
  </body>
</html>
