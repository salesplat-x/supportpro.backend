<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>{{title}}</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #eef1f6;
        color: #3f3f46;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, Helvetica, sans-serif;
      }
      .preheader {
        display: none !important;
        visibility: hidden;
        opacity: 0;
        color: transparent;
        height: 0;
        width: 0;
        overflow: hidden;
        mso-hide: all;
      }
      .wrap {
        width: 100%;
        background-color: #eef1f6;
        padding: 40px 16px;
      }
      .card {
        width: 100%;
        max-width: 560px;
        margin: 0 auto;
        background-color: #ffffff;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 1px 3px rgba(16, 24, 40, 0.06);
      }
      .header {
        padding: 28px 32px;
        background: linear-gradient(135deg, #1e2a4d 0%, #32447a 100%);
        text-align: left;
      }
      .header img {
        height: 26px;
        width: auto;
        display: block;
        border: 0;
      }
      .accent {
        height: 4px;
        line-height: 4px;
        font-size: 0;
        background: linear-gradient(90deg, #4f6df5 0%, #7c5cff 50%, #22c3a6 100%);
      }
      .content {
        padding: 36px 32px 8px;
      }
      .kicker {
        margin: 0 0 10px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #4f6df5;
      }
      h1 {
        margin: 0 0 18px;
        font-size: 23px;
        line-height: 1.35;
        font-weight: 700;
        color: #101828;
      }
      p {
        margin: 0 0 14px;
        font-size: 15px;
        line-height: 1.65;
        color: #43434b;
      }
      .lead {
        font-size: 16px;
        color: #1d2939;
      }
      .muted {
        color: #667085;
        font-size: 14px;
      }
      .button {
        display: inline-block;
        margin: 10px 0 22px;
        padding: 13px 26px;
        background-color: #1e2a4d;
        background-image: linear-gradient(135deg, #253361 0%, #1e2a4d 100%);
        color: #ffffff !important;
        text-decoration: none;
        font-size: 14px;
        font-weight: 700;
        border-radius: 8px;
      }
      .card-box {
        margin: 4px 0 22px;
        padding: 18px 20px;
        background-color: #f7f8fb;
        border: 1px solid #e4e7ec;
        border-radius: 12px;
      }
      .otp {
        margin: 16px 0 20px;
        padding: 16px 18px;
        background-color: #f7f8fb;
        border: 1px solid #e4e7ec;
        border-radius: 12px;
        font-size: 22px;
        letter-spacing: 0.16em;
        font-weight: 700;
        color: #101828;
        text-align: center;
      }
      .rows {
        width: 100%;
        border-collapse: collapse;
        margin: 4px 0 22px;
      }
      .rows td {
        padding: 11px 0;
        font-size: 14px;
        border-bottom: 1px solid #eef0f3;
        vertical-align: top;
      }
      .rows tr:last-child td {
        border-bottom: none;
      }
      .label {
        color: #667085;
        width: 42%;
      }
      .value {
        color: #101828;
        font-weight: 600;
        text-align: right;
      }
      .divider {
        border: none;
        border-top: 1px solid #eef0f3;
        margin: 8px 0 24px;
      }
      .signoff {
        margin-top: 8px;
      }
      .footer {
        padding: 20px 32px 28px;
        font-size: 12px;
        line-height: 1.6;
        color: #98a2b3;
      }
      .footer a {
        color: #98a2b3;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    {{#if preheader}}
    <div class="preheader">{{preheader}}</div>
    {{/if}}
    <div class="wrap">
      <table class="card" role="presentation" cellpadding="0" cellspacing="0" width="100%">
        <tr>
          <td class="header">
            <img src="{{logoUrl}}" alt="Auxhr" />
          </td>
        </tr>
        <tr>
          <td class="accent">&nbsp;</td>
        </tr>
        <tr>
          <td class="content">{{{body}}}</td>
        </tr>
        <tr>
          <td>
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
              <tr>
                <td style="padding: 0 32px;"><hr class="divider" /></td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td class="footer">
            Auxhr — AI-assisted hiring ·
            <a href="mailto:support@auxhr.com">support@auxhr.com</a><br />
            &copy; 2026 Auxhr. All rights reserved.
          </td>
        </tr>
      </table>
    </div>
  </body>
</html>
