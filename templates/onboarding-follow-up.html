{{#each paragraphs}} {{#if @first}}
<p class="lead">{{this}}</p>
{{else}}
<p>{{this}}</p>
{{/if}} {{/each}}
<p><a class="button" href="{{ctaUrl}}">{{ctaLabel}}</a></p>
<p class="signoff muted">The Auxhr team</p>
{{#if unsubscribeUrl}}
<p class="muted">Don't want these reminders? <a href="{{unsubscribeUrl}}">Unsubscribe</a>.</p>
{{/if}}
