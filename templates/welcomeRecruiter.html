<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome to Auxhr</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Raleway:wght@700&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        margin: 0;
        padding: 24px 16px;
        background-color: #f8f8f8;
        font-family: "Inter", Arial, sans-serif;
        font-size: 15px;
        line-height: 1.7;
        color: #4b4b4b;
      }
      .container {
        max-width: 560px;
        margin: 0 auto;
        background-color: #ffffff;
        border-radius: 16px;
        overflow: hidden;
      }
      .header {
        padding: 12px;
        background-color: #4985df;
        text-align: center;
      }
      .header img {
        height: 26px;
        display: inline-block;
      }
      .content {
        padding: 40px 32px;
        text-align: center;
      }
      h1 {
        margin: 0 0 20px;
        font-family: "Raleway", Arial, sans-serif;
        font-size: 26px;
        line-height: 1.3;
        color: #101828;
      }
      p {
        max-width: 400px;
        margin: 0 auto 18px;
      }
      .button {
        display: inline-block;
        margin: 6px 0 24px;
        padding: 13px 26px;
        border-radius: 8px;
        background-color: #4985df;
        color: #ffffff;
        font-weight: 600;
        text-decoration: none;
      }
      .muted {
        margin: 0 auto;
        font-size: 13px;
        color: #667085;
      }
      a {
        color: #4985df;
        text-decoration: none;
      }
      .footer {
        padding: 20px 32px;
        text-align: center;
        font-size: 12px;
        color: #667085;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <img src="{{logoUrl}}" alt="Auxhr" />
      </div>

      <div class="content">
        <h1>Welcome to Auxhr, {{firstName}}</h1>

        <p>
          Thanks for signing up. Auxhr brings sourcing, applications, and hiring decisions into one
          place, so you spend less time chasing and more time choosing.
        </p>

        <p>Your account is ready whenever you are.</p>

        <a class="button" href="{{appUrl}}">Get started</a>

        <p class="muted">
          Questions? Reach us at
          <a href="mailto:support@auxhr.com">support@auxhr.com</a>.
        </p>
      </div>

      <div class="footer">&copy; 2026 Auxhr</div>
    </div>
  </body>
</html>
