<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuxHR OTP Verification</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 600px;
            margin: 20px auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .header {
            padding: 20px;
        }

        .header img {
            max-width: 150px;
        }

        .content {
            padding: 20px;
        }

        .otp-code {
            font-size: 24px;
            font-weight: bold;
            color: #007bff;
            margin: 20px 0;
        }

        .footer {
            font-size: 12px;
            color: #666;
            padding: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <img src="https://yourlogo.com/logo.png" alt="AuxHR Logo">
            <h2>Verify Your Email</h2>
        </div>
        <div class="content">
            <p>Hi {{firstName}},</p>
            <p>Use the OTP code below to verify your email address and secure your AuxHR account.</p>
            <div class="otp-code">{{otp}}</div>
            <p>This code is valid for the next 15 minutes. If you did not request this, please ignore this email.</p>
        </div>
    </div>
</body>

</html>
