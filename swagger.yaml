              - desc
        - name: employmentType
          in: query
          required: false
          schema:
            type: string
            enum: [full_time, part_time, contract, internship]
        - name: minMonthlySalary
          in: query
          required: false
          description: Only jobs whose top monthly pay (yearly pay divided by 12) is at least this, in the chosen currency. Jobs in other currencies or with no pay are left out.
          schema:
            type: integer
            minimum: 0
        - name: currency
          in: query
          required: false
          description: Currency for minMonthlySalary. Defaults to NGN.
          schema:
            type: string
            enum: [NGN, USD]
        - name: postedWithin
          in: query
          required: false
          description: Only jobs posted in the last 7 days.
          schema:
            type: string
            enum: [week]
