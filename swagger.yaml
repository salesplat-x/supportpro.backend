              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      questions:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            question:
                              type: string
                            questionType:
                              type: string
                            options:
                              type: array
                              description: The four answer options, A to D.
                              items:
                                type: string
        "400":
          description: Bad jobId, the test is not switched on for this job, or the candidate hasn't applied
        "401":
          description: Not logged in
        "403":
          description: Only candidates can load these questions
        "404":
          description: Job not found
        "409":
          description: The problem-solving questions couldn't be prepared right now; try again later
      security:
        - bearerAuth: []
