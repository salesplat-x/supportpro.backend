                goals:
                  type: array
                  items:
                    type: string
                department:
                  type: string
                  maxLength: 100
                  nullable: true
                employmentType:
                  type: string
                  enum: [full_time, part_time, contract, internship]
                closesAt:
                  type: string
                  format: date
