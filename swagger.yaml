openapi: 3.0.3
info:
  title: Auto-generated API
  description: Generated from Express route files and Joi validators
  version: 1.0.0
servers:
  - url: https://backend.auxhr.com/v1
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApplicationCheck:
      type: object
      properties:
        id:
          type: string
        applicationId:
          type: string
        type:
          type: string
          enum: [identity, employment, education, criminal]
        restricted:
          type: boolean
          description: True when the caller may not read this check; only id and type are returned
        status:
          type: string
          enum: [pending, passed, flagged, failed]
        resultText:
          type: string
          nullable: true
        confirmedBy:
          type: string
          nullable: true
        confirmedOn:
          type: string
          format: date
          nullable: true
        note:
          type: string
          nullable: true
        nameOnId:
          type: string
          nullable: true
        nameGiven:
          type: string
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        orderedById:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ChecksConsent:
      type: object
      properties:
        applicationId:
          type: string
        state:
          type: string
          enum: [not_requested, requested, agreed, declined]
        version:
          type: string
          nullable: true
        requestedAt:
          type: string
          format: date-time
          nullable: true
        agreedAt:
          type: string
          format: date-time
          nullable: true
        declinedAt:
          type: string
          format: date-time
          nullable: true
        idKind:
          type: string
          enum: [nin, bvn]
          nullable: true
        idNumberLast4:
          type: string
          nullable: true
paths:
