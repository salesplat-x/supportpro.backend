      responses:
        "200":
          description: Answers received and scored
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      submitted:
                        type: boolean
                      questionType:
                        type: string
                      answered:
                        type: integer
        "400":
          description: Bad body, a missing or extra answer, questions not loaded yet, the test is off, the job is closed, or the candidate hasn't applied
        "401":
          description: Not logged in
        "403":
          description: Only candidates can submit answers
        "404":
          description: Job not found
