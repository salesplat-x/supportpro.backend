  /voice/transcribe:
    post:
      summary: Any verified user. Audio in, transcription text out.
      tags:
        - voice
      parameters: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - audio
              properties:
                audio:
                  type: string
                  format: binary
                  description: Recording up to 10 MB and 2 minutes (webm, ogg, mp3, m4a, wav or flac). The length limit is VOICE_MAX_DURATION_SECONDS.
      responses:
        "200":
          description: Transcription
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      transcription:
                        type: string
        "400":
          description: Missing, empty, unsupported or unreadable audio, a file over 10 MB (LIMIT_FILE_SIZE), or a recording that is too long (over 2 minutes by default)
        "401":
          description: Login required
        "403":
          description: EMAIL_VERIFICATION_REQUIRED. The user has not verified their email address yet.
        "429":
          description: Too many voice messages (20 per 15 minutes per user)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: You've sent a lot of voice messages recently — please try again in a few minutes.
        "500":
          description: The speech-to-text provider failed, or recordings cannot be measured on the server
        "504":
          description: VOICE_TIMEOUT. The request ran past its deadline (VOICE_REQUEST_DEADLINE_MS, 60 s by default).
      security:
        - bearerAuth: []
  /voice/chat:
    post:
      summary: Any verified user. Audio in, spoken reply (mp3) out.
      tags:
        - voice
      parameters: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - audio
              properties:
                audio:
                  type: string
                  format: binary
                  description: Recording up to 10 MB and 2 minutes (webm, ogg, mp3, m4a, wav or flac). The length limit is VOICE_MAX_DURATION_SECONDS.
      responses:
        "200":
          description: Spoken reply
          headers:
            X-Voice-Fallback:
              description: '"true" when the canned fallback clip was returned because voice replies are not set up, an upstream service failed or the request ran past its deadline.'
              schema:
                type: string
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
        "400":
          description: Missing, empty, unsupported or unreadable audio, a file over 10 MB (LIMIT_FILE_SIZE), or a recording that is too long (over 2 minutes by default)
        "401":
          description: Login required
        "403":
          description: EMAIL_VERIFICATION_REQUIRED. The user has not verified their email address yet.
        "429":
          description: Too many voice messages (20 per 15 minutes per user)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: You've sent a lot of voice messages recently — please try again in a few minutes.
        "500":
          description: Unexpected server error. Provider failures and timeouts are answered with the fallback clip (X-Voice-Fallback true), not an error.
      security:
        - bearerAuth: []
  /voice/stream:
    post:
      summary: Any verified user. Audio in, spoken reply (mp3) streamed out.
      tags:
        - voice
      parameters: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - audio
              properties:
                audio:
                  type: string
                  format: binary
                  description: Recording up to 10 MB and 2 minutes (webm, ogg, mp3, m4a, wav or flac). The length limit is VOICE_MAX_DURATION_SECONDS.
      responses:
        "200":
          description: Spoken reply, streamed
          headers:
            X-Voice-Fallback:
              description: '"true" when the canned fallback clip was returned because voice replies are not set up, an upstream service failed or the request ran past its deadline.'
              schema:
                type: string
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
        "400":
          description: Missing, empty, unsupported or unreadable audio, a file over 10 MB (LIMIT_FILE_SIZE), or a recording that is too long (over 2 minutes by default)
        "401":
          description: Login required
        "403":
          description: EMAIL_VERIFICATION_REQUIRED. The user has not verified their email address yet.
        "429":
          description: Too many voice messages (20 per 15 minutes per user)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: You've sent a lot of voice messages recently — please try again in a few minutes.
        "500":
          description: Unexpected server error. Provider failures and timeouts are answered with the fallback clip (X-Voice-Fallback true), not an error.
      security:
        - bearerAuth: []
  /references/applications/{applicationId}:
    post:
      summary: Candidate names referees for an application
      description: >-
        The candidate who applied sends 1 to 3 referees (name, email, relationship) in one
        request. Relationship is manager, colleague, client or other. At most 3 referees can
        be named per application in total, and the same email cannot be added twice. Each
        referee is emailed a link that works once and expires after 14 days. If an email
        cannot be sent the referee is still saved with status not_sent. Nothing is saved if
        any referee is invalid. Other users get 403.
      tags:
        - references
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [referees]
              properties:
                referees:
                  type: array
                  minItems: 1
                  maxItems: 3
                  items:
                    type: object
                    required: [name, email, relationship]
                    properties:
                      name:
                        type: string
                        maxLength: 120
                      email:
                        type: string
                        format: email
                      relationship:
                        type: string
                        enum: [manager, colleague, client, other]
      responses:
        "201":
          description: The referees were saved and emailed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      applicationId:
                        type: string
                      references:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            name:
                              type: string
                            email:
                              type: string
                            relationship:
                              type: string
                            status:
                              type: string
                              enum: [not_sent, sent, answered, expired]
                            sentAt:
                              type: string
                              format: date-time
                              nullable: true
                            expiresAt:
                              type: string
                              format: date-time
                            answeredAt:
                              type: string
                              format: date-time
                              nullable: true
        "400":
          description: Invalid input, or 3 referees are already named
        "401":
          description: Login required
        "403":
          description: Only the candidate who applied can add referees
        "404":
          description: Application not found
        "409":
          description: This referee has already been added
      security:
        - bearerAuth: []
    get:
      summary: Candidate sees who was asked for a reference
      description: >-
        Lists the referees named for the application with their status (not_sent, sent,
        answered or expired). It never returns links or answers.
      tags:
        - references
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The referees of the application
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      applicationId:
                        type: string
                      references:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            name:
                              type: string
                            email:
                              type: string
                            relationship:
                              type: string
                            status:
                              type: string
                              enum: [not_sent, sent, answered, expired]
                            sentAt:
                              type: string
                              format: date-time
                              nullable: true
                            expiresAt:
                              type: string
                              format: date-time
                            answeredAt:
                              type: string
                              format: date-time
                              nullable: true
        "401":
          description: Login required
        "403":
          description: Only the candidate who applied can list their referees
        "404":
          description: Application not found
      security:
        - bearerAuth: []
  /references/respond/{token}:
    get:
      summary: Referee opens the link from the reference email
      description: >-
        Public, no account. Returns who is asking and the six questions, each with a type
        (text or yesno). A link that does not exist is 404; a link that has expired or already
        been answered is 410 and carries the job title, company name and company email in
        error.details so the page can say who to contact.
      tags:
        - references
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The questions to answer
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      refereeName:
                        type: string
                      candidateName:
                        type: string
                      jobTitle:
                        type: string
                      companyName:
                        type: string
                        nullable: true
                      expiresAt:
                        type: string
                        format: date-time
                      questions:
                        type: array
                        items:
                          type: object
                          properties:
                            key:
                              type: string
                            question:
                              type: string
                            required:
                              type: boolean
                            type:
                              type: string
                              enum: [text, yesno]
        "400":
          description: The link is malformed
        "404":
          description: The link does not exist
        "410":
          description: The link has expired or was already used
    post:
      summary: Referee sends the answers
      description: >-
        Public, no account. The first five answers are required and the last is optional;
        each is at most 2000 characters. The link works once: a second use or an expired link
        is 410.
      tags:
        - references
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                answers:
                  type: object
                  required: [worked_together, strengths, improve, reliability, hire_again]
                  properties:
                    worked_together:
                      type: string
                    strengths:
                      type: string
                    improve:
                      type: string
                    reliability:
                      type: string
                    hire_again:
                      type: string
                      enum: ["Yes", "No"]
                    anything_else:
                      type: string
      responses:
        "200":
          description: The answers were saved
        "400":
          description: A required answer is missing or too long
        "404":
          description: The link does not exist
        "410":
          description: The link has expired or was already used
  /references/applications/{applicationId}/answers:
    get:
      summary: Posting company reads the references of an application
      description: >-
        Returns every referee named for the application with their status (not_sent, sent,
        answered or expired) and, once they have answered, their answers with the question
        text. Only members of the company that posted the job can read it; the candidate and
        other users get 403.
      tags:
        - references
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The referees and their answers
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      applicationId:
                        type: string
                      references:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            name:
                              type: string
                            email:
                              type: string
                            relationship:
                              type: string
                            status:
                              type: string
                              enum: [not_sent, sent, answered, expired]
                            answers:
                              type: array
                              nullable: true
                              items:
                                type: object
                                properties:
                                  key:
                                    type: string
                                  question:
                                    type: string
                                  answer:
                                    type: string
        "401":
          description: Login required
        "403":
          description: Only the company that posted the job can read the references
        "404":
          description: Application not found
      security:
        - bearerAuth: []
  /references/{referenceId}/resend:
    post:
      summary: Posting company sends a referee a new link
      description: >-
        Replaces the referee's link with a new one that works once and expires after 14 days,
        and emails it. The old link stops working. A referee who already answered cannot be
        sent another request (409). Only members of the company that posted the job can resend.
      tags:
        - references
      parameters:
        - name: referenceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The new link was issued; status is not_sent if the email failed
        "401":
          description: Login required
        "403":
          description: Only the company that posted the job can resend
        "404":
          description: Reference not found
        "409":
          description: This referee has already answered
      security:
        - bearerAuth: []
  /interviews/{interviewId}/questions/{questionId}/recording:
    put:
      summary: Candidate uploads an interview answer recording
      description: >-
        One audio or video file up to 25 MB, stored privately. Only the candidate of
        the interview can upload; an audio-only interview takes audio files only. A new upload
        replaces the earlier recording for that question.
      tags:
        - interviews
      parameters:
        - name: interviewId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: questionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                recording:
                  type: string
                  format: binary
                  description: audio/* or video/*, at most 25 MB.
              required:
                - recording
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      questionId:
                        type: string
                      recordedAt:
                        type: string
                        format: date-time
                      size:
                        type: integer
                      mimeType:
                        type: string
        "400":
          description: No file, not audio or video, over 25 MB, or video on an audio-only interview
        "401":
          description: Not logged in
        "403":
          description: Not the candidate of this interview
        "404":
          description: Interview or question not found
        "503":
          description: Recording storage is not set up (DO_SPACES_* missing)
      security:
        - bearerAuth: []
    get:
      summary: Open an interview answer recording
      description: >-
        Streams the recording. Only the candidate and members of the company that
        posted the job can open it; everyone else, platform admins included, gets 403.
      tags:
        - interviews
      parameters:
        - name: interviewId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: questionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The recording
          content:
            audio/*:
              schema:
                type: string
                format: binary
            video/*:
              schema:
                type: string
                format: binary
        "401":
          description: Not logged in
        "403":
          description: Not the candidate or a member of the posting company
        "404":
          description: Interview, question or recording not found
        "503":
          description: Recording storage is not set up (DO_SPACES_* missing)
      security:
        - bearerAuth: []
  /interviews/{interviewId}:
    get:
      summary: Candidate loads an AI interview with its questions and where to resume
      description: >-
        Returns the interview's questions in order, which ones have an answer
        recording, and the first unanswered question (nextQuestionId, null once all are
        answered). Only the candidate of the interview can open it; the company and other
        users get 403.
      tags:
        - interviews
      parameters:
        - name: interviewId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The interview with its questions and answer progress
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      jobId:
                        type: string
                        format: uuid
                      mode:
                        type: string
                        enum:
                          - audio
                          - audio_video
                      status:
                        type: string
                        enum:
                          - pending
                          - ready
                          - invited
                          - failed
                      totalQuestions:
                        type: integer
                      answeredCount:
                        type: integer
                      nextQuestionId:
                        type: string
                        format: uuid
                        nullable: true
                      questions:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                            position:
                              type: integer
                            question:
                              type: string
                            answered:
                              type: boolean
                            recordedAt:
                              type: string
                              format: date-time
                              nullable: true
        "401":
          description: Not logged in
        "403":
          description: Not the candidate of this interview
        "404":
          description: Interview not found
      security:
        - bearerAuth: []
  /interviews/{interviewId}/transcripts:
    get:
      summary: Posting company reads the answer transcripts of an AI interview
      description: >-
        Returns each question of the interview with whether it has a recording and
        its transcript. A background job writes the transcript after the candidate uploads
        a recording; transcriptStatus is pending while it waits or retries, completed once
        saved, and failed when the recording is too long, unreadable or silent, or the
        retries ran out. Only members of the company that posted the job can read it; the
        candidate and other users get 403.
      tags:
        - interviews
      parameters:
        - name: interviewId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Each question with its recording state and transcript
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      interviewId:
                        type: string
                      questions:
                        type: array
                        items:
                          type: object
                          properties:
                            questionId:
                              type: string
                            position:
                              type: integer
                            isFollowUp:
                              type: boolean
                              description: True for a follow-up asked after the answer at the same position.
                            question:
                              type: string
                            recorded:
                              type: boolean
                            transcriptStatus:
                              type: string
                              nullable: true
                              enum: [pending, completed, failed]
                            transcript:
                              type: string
                              nullable: true
                            transcribedAt:
                              type: string
                              format: date-time
                              nullable: true
        "401":
          description: Login required
        "403":
          description: Not a member of the company that posted the job
        "404":
          description: Interview not found
      security:
        - bearerAuth: []
  /interviews/{interviewId}/assessment:
    get:
      summary: Posting company reads the advice on an interview (scores, summary, flags)
      description: >-
        Once every answer is in and transcribed, the scoring covers clear speaking, fit for the
        role and confidence from 1 to 5, each with a reason, writes a short summary and lists
        flags worth a closer look. The scores are advice only: nothing here changes the
        application or the candidate's status. status is pending while the scoring waits or
        retries, completed once saved, and failed when the retries ran out; scores, summary and
        flags are null until it is completed. Only members of the company that posted the job
        can read it; the candidate and other users get 403.
      tags:
        - interviews
      parameters:
        - name: interviewId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The advice for the interview
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      interviewId:
                        type: string
                      status:
                        type: string
                        nullable: true
                        enum: [pending, completed, failed]
                      scores:
                        type: object
                        nullable: true
                        properties:
                          clearSpeaking:
                            type: object
                            properties:
                              score:
                                type: integer
                                minimum: 1
                                maximum: 5
                              reason:
                                type: string
                          fitForRole:
                            type: object
                            properties:
                              score:
                                type: integer
                                minimum: 1
                                maximum: 5
                              reason:
                                type: string
                          confidence:
                            type: object
                            properties:
                              score:
                                type: integer
                                minimum: 1
                                maximum: 5
                              reason:
                                type: string
                      summary:
                        type: string
                        nullable: true
                      flags:
                        type: array
                        nullable: true
                        items:
                          type: object
                          properties:
                            text:
                              type: string
                            question:
                              type: integer
                              nullable: true
                              description: Position of the answer the flag is about; null for the whole interview.
                      scoredAt:
                        type: string
                        format: date-time
                        nullable: true
        "401":
          description: Login required
        "403":
          description: Not a member of the company that posted the job; the candidate is refused too
        "404":
          description: Interview not found
      security:
        - bearerAuth: []
  /checks/applications/{applicationId}/consent:
    post:
      summary: Candidate agrees to background checks for an application
      description: >-
        The candidate who applied agrees once to background checks for this application, at the
        current consent text version, and gives a NIN or BVN (exactly 11 digits) for the identity
        check. The number is stored encrypted and only its last four digits are ever returned.
        The first agreement is kept; a repeat returns it with 200. A candidate who declined
        earlier can still agree. No check can be ordered until this is given. Other users get 403.
      tags:
        - checks
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, idKind, idNumber]
              properties:
                version:
                  type: string
                  description: The consent text version the candidate read, currently 2026-11-v2
                  example: 2026-11-v2
                idKind:
                  type: string
                  enum: [nin, bvn]
                idNumber:
                  type: string
                  pattern: "^[0-9]{11}$"
      responses:
        "200":
          description: The candidate had already agreed; the first agreement is returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/ChecksConsent"
        "201":
          description: The agreement was recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/ChecksConsent"
        "400":
          description: The consent text version is not the current one, or the number is not 11 digits
        "401":
          description: Login required
        "403":
          description: Only the candidate who applied can agree
        "404":
          description: Application not found
      security:
        - bearerAuth: []
    get:
      summary: Company reads whether the candidate agreed to background checks
      description: >-
        Returns the consent state for this application: not_requested, requested, agreed or
        declined. Only a recruiter of the company that posted the job can read it; other users
        get 403.
      tags:
        - checks
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Consent state for the application
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/ChecksConsent"
        "401":
          description: Login required
        "403":
          description: Only the posting company can read consent
        "404":
          description: Application not found
      security:
        - bearerAuth: []
  /checks/applications/{applicationId}/consent/mine:
    get:
      summary: Candidate reads their own background checks consent
      description: >-
        Returns the consent state for the candidate's own application, so the Checks step can
        show whether it was requested, agreed or declined. Other users get 403.
      tags:
        - checks
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Consent state for the application
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/ChecksConsent"
        "401":
          description: Login required
        "403":
          description: Only the candidate who applied can read this
        "404":
          description: Application not found
      security:
        - bearerAuth: []
  /checks/applications/{applicationId}/consent/decline:
    post:
      summary: Candidate declines background checks
      description: >-
        The candidate who applied declines background checks. Checks cannot be ordered while the
        decline stands, and the candidate can still agree later. Returns 409 once they agreed.
      tags:
        - checks
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The decline was recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/ChecksConsent"
        "401":
          description: Login required
        "403":
          description: Only the candidate who applied can decline
        "404":
          description: Application not found
        "409":
          description: The candidate already agreed
      security:
        - bearerAuth: []
  /checks/applications/{applicationId}/consent/request:
    post:
      summary: Company asks the candidate for consent to background checks
      description: >-
        Candidates are asked automatically when shortlisted. This asks when no request exists
        yet (an application shortlisted earlier, or a failed email). It emails the candidate and
        returns 201; when a request already exists nothing is sent and it returns 200.
      tags:
        - checks
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: A request already exists
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/ChecksConsent"
        "201":
          description: The request was created and the candidate emailed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/ChecksConsent"
        "401":
          description: Login required
        "403":
          description: Only the posting company can ask
        "404":
          description: Application not found
      security:
        - bearerAuth: []
  /checks/applications/{applicationId}:
    post:
      summary: Company orders a background check for an application
      description: >-
        A recruiter of the company that posted the job orders one check on the candidate:
        identity, employment, education or criminal. The check starts as pending and the order is
        written to its history. It is refused with 409 until the candidate has agreed to
        background checks (and while a decline stands), when the same type was already ordered,
        and for criminal with code NOT_AVAILABLE_IN_COUNTRY unless the candidate's country is on
        the allowed list (empty by default). Other users get 403.
      tags:
        - checks
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type:
                  type: string
                  enum: [identity, employment, education, criminal]
      responses:
        "201":
          description: The check was ordered
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      applicationId:
                        type: string
                      type:
                        type: string
                        enum: [identity, employment, education, criminal]
                      status:
                        type: string
                        enum: [pending, passed, flagged, failed]
                      resultText:
                        type: string
                        nullable: true
                      completedAt:
                        type: string
                        format: date-time
                        nullable: true
                      orderedById:
                        type: string
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
        "400":
          description: The check type is not one of the four
        "401":
          description: Login required
        "403":
          description: Only a recruiter of the company that posted the job can order checks
        "404":
          description: Application not found
        "409":
          description: Consent is missing or declined, the type was already ordered, or criminal checks are not available in the candidate's country
      security:
        - bearerAuth: []
    get:
      summary: Company reads the checks for an application with one overall status
      description: >-
        For members of the company that posted the job. Returns the consent state, the overall
        status (failed if any check failed, else flagged, else pending, else verified; none with
        no checks) and every check. A check is returned in full only to the member who ordered
        it and the company owner; for any other member it is returned as restricted with only
        its id and type. Every full read of a finished result is written to that check's
        history before the response is sent. Other users get 403.
      tags:
        - checks
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The checks and their overall status
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      applicationId:
                        type: string
                      candidateName:
                        type: string
                      consent:
                        type: string
                        enum: [not_requested, requested, agreed, declined]
                      overallStatus:
                        type: string
                        enum: [failed, flagged, pending, verified, none]
                      criminalAvailable:
                        type: boolean
                      ownerName:
                        type: string
                      checks:
                        type: array
                        items:
                          $ref: "#/components/schemas/ApplicationCheck"
        "401":
          description: Login required
        "403":
          description: Only members of the company that posted the job can read checks
        "404":
          description: Application not found
      security:
        - bearerAuth: []
  /checks/{checkId}/result:
    patch:
      summary: Enter or change the result of a check by hand
      description: >-
        Only the member who ordered the check and the company owner. Employment, education and
        criminal take confirmedBy, confirmedOn, result (verified, flagged or failed) and an
        optional note. Identity takes nameOnId, confirmedOn and an optional note; the name is
        compared with the name the candidate gave (case, spacing and word order ignored) and the
        check becomes passed or failed. The change is written to the check's history.
      tags:
        - checks
      parameters:
        - name: checkId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmedOn]
              properties:
                confirmedOn:
                  type: string
                  format: date
                confirmedBy:
                  type: string
                  maxLength: 160
                result:
                  type: string
                  enum: [verified, flagged, failed]
                nameOnId:
                  type: string
                  maxLength: 200
                note:
                  type: string
                  maxLength: 2000
      responses:
        "200":
          description: The saved check
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/ApplicationCheck"
        "400":
          description: A field is missing or invalid, or the date is in the future
        "401":
          description: Login required
        "403":
          description: Only the orderer and the company owner can enter a result
        "404":
          description: Check not found
      security:
        - bearerAuth: []
  /checks/{checkId}/history:
    get:
      summary: Every order, change and view of a check
      description: >-
        Lists the events on a check, oldest first, with who did each and when. Only the member
        who ordered the check and the company owner can read it.
      tags:
        - checks
      parameters:
        - name: checkId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The events
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      checkId:
                        type: string
                      type:
                        type: string
                      events:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            kind:
                              type: string
                              enum: [ordered, result_saved, viewed, id_number_viewed]
                            detail:
                              type: string
                              nullable: true
                            actorName:
                              type: string
                              nullable: true
                            createdAt:
                              type: string
                              format: date-time
        "401":
          description: Login required
        "403":
          description: Only the orderer and the company owner can read the history
        "404":
          description: Check not found
      security:
        - bearerAuth: []
  /checks/{checkId}/id-number:
    get:
      summary: Read the NIN or BVN the candidate gave for an identity check
      description: >-
        Decrypts and returns the number. Only the member who ordered the identity check and the
        company owner can read it, and every read is written to the check's history.
      tags:
        - checks
      parameters:
        - name: checkId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The ID number
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      checkId:
                        type: string
                      idKind:
                        type: string
                        enum: [nin, bvn]
                      idNumber:
                        type: string
        "401":
          description: Login required
        "403":
          description: Only the orderer and the company owner can read the number
        "404":
          description: Not an identity check, or not found
        "409":
          description: The candidate has not given an ID number
      security:
        - bearerAuth: []
