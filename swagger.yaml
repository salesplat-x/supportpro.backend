  /applications/{_id}/advance:
    post:
      summary: Recruiter. Move a candidate forward.
      description: >-
        Shortlists the candidate. When the job runs a recorded AI interview and the candidate has
        none yet, also starts it (writes the questions) and emails the invite if sendInterviewInvite
        is true. Rejected candidates can't move forward.
      tags:
        - applications
      parameters:
        - name: _id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sendInterviewInvite:
                  type: boolean
              required:
                - sendInterviewInvite
      responses:
        "200":
          description: >-
            application, nextStep (ai_interview or shortlisted) and interview: invited, ready
            (started, no email sent), failed (the questions could not be written), skipped, or null
            when no interview was due.
          content:
            application/json:
              schema:
                type: object
        "400":
          description: The candidate was rejected.
        "403":
          description: The job belongs to another company.
      security:
        - bearerAuth: []
  /applications/{_id}/personality-fit:
    post:
      summary: Recruiter — retry the personality fit for an application
      description: >-
        Asks the AI again how the applicant's personality (MBTI) type fits the job, for when the automatic try after the personality test failed.
        Returns the existing fit without calling the AI if one is already saved. Only the job's company can call it.
      tags:
        - applications
      parameters:
        - name: _id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The saved personality fit
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      personalityFitScore:
                        type: number
                        description: The AI's 0-100 judgement of the fit.
                      personalityFitReason:
                        type: string
        "400":
          description: The candidate hasn't finished the personality test, or the test is switched off for this job.
        "403":
          description: The application belongs to another company.
        "404":
          description: Application not found.
        "409":
          description: The fit is already being worked out.
        "502":
          description: The AI call failed or gave an unusable reply (PERSONALITY_FIT_FAILED). Safe to retry.
      security:
        - bearerAuth: []
  /questions/candidate/problem-solving:
    get:
      summary: Candidate — load my problem-solving questions for a job
      description: >-
        For an applicant to a job whose problem-solving test is switched on. The first call picks the recruiter's chosen number of multiple-choice questions at random from the job's pool and keeps them on the application; later calls return the same set.
        If the pool has no multiple-choice questions yet, they are generated first. The correct option and scoring criteria are never sent.
      tags:
        - questions
      parameters:
        - name: jobId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The candidate's questions
          content:
