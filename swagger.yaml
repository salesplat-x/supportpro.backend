              schema:
                type: object
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bio:
                  type: string
                cv:
                  type: string
                location:
                  type: object
                  properties:
                    city:
                      type: string
                    state:
                      type: string
                    country:
                      type: string
                  required:
                    - state
                    - country
                remote:
                  type: boolean
                onSite:
                  type: boolean
                hybrid:
                  type: boolean
                experience:
                  type: string
                  enum:
                    - 1-3 years
                    - 4-6 years
                    - 7-10 years
                    - 11-15 years
                    - 16 years and above
                maxSalary:
                  type: number
                minSalary:
                  type: number
                role:
                  type: array
                  items:
                    type: string
              required:
                - bio
                - cv
                - location
                - remote
                - onSite
                - hybrid
                - experience
                - maxSalary
                - minSalary
      security:
        - bearerAuth: []
    patch:
      summary: Talent
      tags:
        - user
      parameters: []
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bio:
                  type: string
                cv:
                  type: string
                remote:
                  type: boolean
                onSite:
                  type: boolean
                hybrid:
                  type: boolean
                location:
                  type: object
                  properties:
                    city:
                      type: string
                    state:
                      type: string
                    country:
                      type: string
                  required:
                    - state
                    - country
                experience:
                  type: string
                  enum:
                    - 1-3 years
                    - 4-6 years
                    - 7-10 years
                    - 11-15 years
                    - 16 years and above
                maxSalary:
                  type: number
                minSalary:
                  type: number
                role:
                  type: array
                  items:
                    type: string
              required:
