              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      questions:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            question:
                              type: string
                            questionType:
                              type: string
        "400":
          description: Bad jobId, the test is not switched on for this job, or the candidate hasn't applied
        "401":
          description: Not logged in
        "403":
          description: Only candidates can load these questions
        "404":
          description: Job not found
        "409":
          description: The job has no culture-fit questions yet (the recruiter hasn't generated them)
      security:
        - bearerAuth: []
  /questions/answer/problem-solving:
    post:
      summary: Candidate — submit my problem-solving answers
      description: >-
        Answers to exactly the problem-solving questions the candidate was given. Each answer is graded 0-5 against its question's criteria; the score is total / (5 x answers) as a percentage, saved on the application as problemSolvingScore.
        One submission per test. The candidate is not shown the score.
      tags:
        - questions
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jobId:
                  type: string
                  format: uuid
                answers:
                  type: object
                  description: Question id to answer text (1-5000 characters each).
                  additionalProperties:
                    type: string
              required:
                - jobId
                - answers
      responses:
        "200":
          description: Answers received and scored
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      submitted:
                        type: boolean
                      questionType:
                        type: string
                      answered:
                        type: integer
        "400":
          description: Bad body, a missing or extra answer, questions not loaded yet, the test is off, the job is closed, or the candidate hasn't applied
        "401":
          description: Not logged in
        "403":
          description: Only candidates can submit answers
        "404":
          description: Job not found
        "409":
          description: Already submitted
        "502":
          description: The answers couldn't be scored right now; nothing was saved, so the candidate can try again
      security:
        - bearerAuth: []
  /questions/answer/culture-fit:
    post:
      summary: Candidate — submit my culture-fit answers
      description: >-
        Answers to exactly the culture-fit questions the candidate was given. Each answer is graded 0-5 against its question's criteria; the score is total / (5 x answers) as a percentage, saved on the application as cultureFitScore.
        One submission per test. The candidate is not shown the score.
