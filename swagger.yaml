  /jobs/salary-comparison:
    get:
      summary: Recruiter — what similar AuxHR jobs pay (Day 10)
      description: >-
        Low, middle (median) and high pay of jobs with the same role, experience level and location (drafts left out), converted to the asked currency and period. Each job's pay is the middle of its range, or its minimum when it has no maximum. Other currencies are converted with the SALARY_FX_RATES config and skipped without a rate. Returns {available false} when fewer than 5 jobs can be compared.
      tags:
        - jobs
      parameters:
        - name: roleId
          in: query
          required: true
          description: The job role.
          schema:
            type: string
        - name: experienceLevel
          in: query
          required: true
          description: Experience level, e.g. 1-3 years.
          schema:
            type: string
        - name: currency
          in: query
          required: true
          description: Currency to show the pay in (NGN, USD, GBP, EUR).
          schema:
            type: string
        - name: compensationPeriod
          in: query
          required: true
          description: monthly or yearly.
          schema:
            type: string
            enum: [monthly, yearly]
        - name: locationCity
          in: query
          required: false
          description: City (case-insensitive).
          schema:
            type: string
        - name: locationState
          in: query
          required: false
          description: State (case-insensitive).
          schema:
            type: string
        - name: locationCountry
          in: query
          required: false
          description: Country (case-insensitive).
          schema:
            type: string
        - name: excludeJobId
          in: query
          required: false
          description: The job being edited, left out of the comparison.
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      available:
                        type: boolean
                      count:
                        type: integer
                        description: How many AuxHR jobs were compared.
                      low:
                        type: number
                      middle:
                        type: number
                      high:
                        type: number
                      currency:
                        type: string
                      compensationPeriod:
                        type: string
                        enum: [monthly, yearly]
        "403":
          description: Not a recruiter or admin
      security:
        - bearerAuth: []
  /jobs/applications/{jobId}:
    patch:
      summary: Talent
      tags:
        - jobs
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                source:
                  type: string
                  maxLength: 50
                  description: >-
                    Where the candidate's link came from: the job link's ?source= (or utm_source), e.g. whatsapp, linkedin, x, facebook, indeed. Saved trimmed and lower-cased on the application.
                note:
                  type: string
                  maxLength: 1000
                  nullable: true
                  description: An optional short note to the company, saved trimmed on the application. Ignored when the candidate has already applied.
      responses:
        "201":
          description: Applied, or the candidate's existing application when they had already applied
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Bad body, the job isn't taking applications, or the candidate has no CV on their profile
      security:
        - bearerAuth: []
    get:
      summary: Recruiter
      tags:
        - jobs
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
        - name: source
          in: query
          required: false
          description: Only applicants whose source matches (case-insensitive), e.g. whatsapp.
          schema:
            type: string
            maxLength: 50
        - name: experience
          in: query
          required: false
          schema:
            type: string
        - name: minCvSimilarityScore
          in: query
          required: false
          schema:
            type: number
        - name: minPersonalizedScore
          in: query
          required: false
          schema:
            type: number
        - name: applicationType
          in: query
          required: false
          schema:
            type: string
            enum:
              - by invitation
              - by application
        - name: applicationStatus
          in: query
          required: false
          schema:
            type: string
            enum:
              - pending
              - retake_assessment
              - not_proceeding
              - shortlisted
              - rejected
        - name: maxSalary
          in: query
          required: false
          schema:
            type: number
        - name: offset
          in: query
          required: false
          schema:
            type: number
        - name: skip
          in: query
          required: false
          schema:
            type: number
        - name: q
          in: query
          required: false
          description: Search applicants by name or email.
          schema:
            type: string
            maxLength: 100
        - name: boardColumn
          in: query
          required: false
          description: Only applicants in this board column. Rejected applicants are never in a column.
          schema:
            type: string
            enum: [applied, cv_matched, pre_screened, personality_test, shortlisted]
        - name: interview
          in: query
          required: false
          description: Only applicants whose recorded AI interview is at this point.
          schema:
            type: string
            enum: [not_started, in_progress, processing, ready]
        - name: verification
          in: query
          required: false
          description: >-
            Only applicants with this overall background check status (failed if any check
            failed, else flagged, else pending, else verified; none when no check was ordered).
          schema:
            type: string
            enum: [none, pending, flagged, failed, verified]
      responses:
        "200":
          description: >-
            Applications with stage, boardColumn, interview {id, status} and verification on each,
            plus total (matching the filters, before paging) and aiConfig.
          content:
            application/json:
              schema:
                type: object
      security:
        - bearerAuth: []
