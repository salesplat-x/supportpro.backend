  /voice/transcribe:
    post:
      summary: Any verified user. Audio in, transcription text out.
      tags:
        - voice
      parameters: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - audio
              properties:
                audio:
                  type: string
                  format: binary
                  description: Recording up to 10 MB and 2 minutes (webm, ogg, mp3, m4a, wav or flac). The length limit is VOICE_MAX_DURATION_SECONDS.
      responses:
        "200":
          description: Transcription
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      transcription:
                        type: string
        "400":
          description: Missing, empty, unsupported or unreadable audio, a file over 10 MB (LIMIT_FILE_SIZE), or a recording that is too long (over 2 minutes by default)
        "401":
          description: Login required
        "403":
          description: EMAIL_VERIFICATION_REQUIRED. The user has not verified their email address yet.
        "429":
          description: Too many voice messages (20 per 15 minutes per user)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: You've sent a lot of voice messages recently — please try again in a few minutes.
        "500":
          description: The speech-to-text provider failed, or recordings cannot be measured on the server
        "504":
          description: VOICE_TIMEOUT. The request ran past its deadline (VOICE_REQUEST_DEADLINE_MS, 60 s by default).
      security:
        - bearerAuth: []
  /voice/chat:
    post:
      summary: Any verified user. Audio in, spoken reply (mp3) out.
      tags:
        - voice
      parameters: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - audio
              properties:
                audio:
                  type: string
                  format: binary
                  description: Recording up to 10 MB and 2 minutes (webm, ogg, mp3, m4a, wav or flac). The length limit is VOICE_MAX_DURATION_SECONDS.
      responses:
        "200":
          description: Spoken reply
          headers:
            X-Voice-Fallback:
              description: '"true" when the canned fallback clip was returned because voice replies are not set up, an upstream service failed or the request ran past its deadline.'
              schema:
                type: string
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
        "400":
          description: Missing, empty, unsupported or unreadable audio, a file over 10 MB (LIMIT_FILE_SIZE), or a recording that is too long (over 2 minutes by default)
        "401":
          description: Login required
        "403":
          description: EMAIL_VERIFICATION_REQUIRED. The user has not verified their email address yet.
        "429":
          description: Too many voice messages (20 per 15 minutes per user)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: You've sent a lot of voice messages recently — please try again in a few minutes.
        "500":
          description: Unexpected server error. Provider failures and timeouts are answered with the fallback clip (X-Voice-Fallback true), not an error.
      security:
        - bearerAuth: []
  /voice/stream:
    post:
      summary: Any verified user. Audio in, spoken reply (mp3) streamed out.
      tags:
        - voice
      parameters: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - audio
              properties:
                audio:
                  type: string
                  format: binary
                  description: Recording up to 10 MB and 2 minutes (webm, ogg, mp3, m4a, wav or flac). The length limit is VOICE_MAX_DURATION_SECONDS.
      responses:
        "200":
          description: Spoken reply, streamed
          headers:
            X-Voice-Fallback:
              description: '"true" when the canned fallback clip was returned because voice replies are not set up, an upstream service failed or the request ran past its deadline.'
              schema:
                type: string
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
        "400":
          description: Missing, empty, unsupported or unreadable audio, a file over 10 MB (LIMIT_FILE_SIZE), or a recording that is too long (over 2 minutes by default)
        "401":
          description: Login required
        "403":
          description: EMAIL_VERIFICATION_REQUIRED. The user has not verified their email address yet.
        "429":
          description: Too many voice messages (20 per 15 minutes per user)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: You've sent a lot of voice messages recently — please try again in a few minutes.
        "500":
          description: Unexpected server error. Provider failures and timeouts are answered with the fallback clip (X-Voice-Fallback true), not an error.
      security:
        - bearerAuth: []
  /references/applications/{applicationId}:
    post:
      summary: Candidate names a referee for an application
      description: >-
        The candidate who applied adds one referee (name, email, relationship). At most 3
        referees can be named per application, and the same email cannot be added twice. The
        referee is emailed a link that works once and expires after 14 days. If the email
        cannot be sent the referee is still saved with status not_sent. Other users get 403.
      tags:
        - references
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, relationship]
              properties:
                name:
                  type: string
                  maxLength: 120
                email:
                  type: string
                  format: email
                relationship:
                  type: string
                  maxLength: 120
      responses:
        "201":
          description: The referee was saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      email:
                        type: string
                      relationship:
                        type: string
                      status:
                        type: string
                        enum: [not_sent, sent, answered, expired]
                      sentAt:
                        type: string
                        format: date-time
                        nullable: true
                      expiresAt:
                        type: string
                        format: date-time
                      answeredAt:
                        type: string
                        format: date-time
                        nullable: true
        "400":
          description: Invalid input, or 3 referees are already named
        "401":
          description: Login required
        "403":
          description: Only the candidate who applied can add referees
        "404":
          description: Application not found
        "409":
          description: This referee has already been added
      security:
        - bearerAuth: []
    get:
      summary: Candidate sees who was asked for a reference
      description: >-
        Lists the referees named for the application with their status (not_sent, sent,
        answered or expired). It never returns links or answers.
      tags:
        - references
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The referees of the application
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      applicationId:
                        type: string
                      references:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            name:
                              type: string
                            email:
                              type: string
                            relationship:
                              type: string
                            status:
                              type: string
                              enum: [not_sent, sent, answered, expired]
                            sentAt:
                              type: string
                              format: date-time
                              nullable: true
                            expiresAt:
                              type: string
                              format: date-time
                            answeredAt:
                              type: string
                              format: date-time
                              nullable: true
        "401":
          description: Login required
        "403":
          description: Only the candidate who applied can list their referees
        "404":
          description: Application not found
      security:
        - bearerAuth: []
  /references/respond/{token}:
    get:
      summary: Referee opens the link from the reference email
      description: >-
        Public, no account. Returns who is asking and the six questions. A link that does not
        exist is 404; a link that has expired or already been answered is 410.
      tags:
        - references
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The questions to answer
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      refereeName:
                        type: string
                      candidateName:
                        type: string
                      jobTitle:
                        type: string
                      companyName:
                        type: string
                        nullable: true
                      expiresAt:
                        type: string
                        format: date-time
                      questions:
                        type: array
                        items:
                          type: object
                          properties:
                            key:
                              type: string
                            question:
                              type: string
                            required:
                              type: boolean
        "400":
          description: The link is malformed
        "404":
          description: The link does not exist
        "410":
          description: The link has expired or was already used
    post:
      summary: Referee sends the answers
      description: >-
        Public, no account. The first five answers are required and the last is optional;
        each is at most 2000 characters. The link works once: a second use or an expired link
        is 410.
      tags:
        - references
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                answers:
                  type: object
                  required: [worked_together, strengths, improve, reliability, hire_again]
                  properties:
                    worked_together:
                      type: string
                    strengths:
                      type: string
                    improve:
                      type: string
                    reliability:
                      type: string
                    hire_again:
                      type: string
                    anything_else:
                      type: string
      responses:
        "200":
          description: The answers were saved
        "400":
          description: A required answer is missing or too long
        "404":
          description: The link does not exist
        "410":
          description: The link has expired or was already used
  /references/applications/{applicationId}/answers:
    get:
      summary: Posting company reads the references of an application
      description: >-
        Returns every referee named for the application with their status (not_sent, sent,
        answered or expired) and, once they have answered, their answers with the question
        text. Only members of the company that posted the job can read it; the candidate and
        other users get 403.
      tags:
        - references
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The referees and their answers
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      applicationId:
                        type: string
                      references:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            name:
                              type: string
                            email:
                              type: string
                            relationship:
                              type: string
                            status:
                              type: string
                              enum: [not_sent, sent, answered, expired]
                            answers:
                              type: array
                              nullable: true
                              items:
                                type: object
                                properties:
                                  key:
                                    type: string
                                  question:
                                    type: string
                                  answer:
                                    type: string
        "401":
          description: Login required
        "403":
          description: Only the company that posted the job can read the references
        "404":
          description: Application not found
      security:
        - bearerAuth: []
  /references/{referenceId}/resend:
    post:
      summary: Posting company sends a referee a new link
      description: >-
        Replaces the referee's link with a new one that works once and expires after 14 days,
        and emails it. The old link stops working. A referee who already answered cannot be
        sent another request (409). Only members of the company that posted the job can resend.
      tags:
        - references
      parameters:
        - name: referenceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The new link was issued; status is not_sent if the email failed
        "401":
          description: Login required
        "403":
          description: Only the company that posted the job can resend
        "404":
          description: Reference not found
        "409":
          description: This referee has already answered
      security:
        - bearerAuth: []
  /interviews/{interviewId}/questions/{questionId}/recording:
    put:
      summary: Candidate uploads an interview answer recording
      description: >-
        One audio or video file up to 25 MB, stored privately. Only the candidate of
        the interview can upload; an audio-only interview takes audio files only. A new upload
        replaces the earlier recording for that question.
      tags:
        - interviews
      parameters:
        - name: interviewId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: questionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                recording:
                  type: string
                  format: binary
                  description: audio/* or video/*, at most 25 MB.
              required:
                - recording
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      questionId:
                        type: string
                      recordedAt:
                        type: string
                        format: date-time
                      size:
                        type: integer
                      mimeType:
                        type: string
        "400":
          description: No file, not audio or video, over 25 MB, or video on an audio-only interview
        "401":
          description: Not logged in
        "403":
          description: Not the candidate of this interview
        "404":
          description: Interview or question not found
        "503":
          description: Recording storage is not set up (DO_SPACES_* missing)
      security:
        - bearerAuth: []
    get:
      summary: Open an interview answer recording
      description: >-
        Streams the recording. Only the candidate and members of the company that
        posted the job can open it; everyone else, platform admins included, gets 403.
      tags:
        - interviews
      parameters:
        - name: interviewId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: questionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The recording
          content:
            audio/*:
              schema:
                type: string
                format: binary
            video/*:
              schema:
                type: string
                format: binary
        "401":
          description: Not logged in
        "403":
          description: Not the candidate or a member of the posting company
        "404":
          description: Interview, question or recording not found
        "503":
          description: Recording storage is not set up (DO_SPACES_* missing)
      security:
        - bearerAuth: []
  /interviews/{interviewId}:
    get:
      summary: Candidate loads an AI interview with its questions and where to resume
      description: >-
        Returns the interview's questions in order, which ones have an answer
        recording, and the first unanswered question (nextQuestionId, null once all are
        answered). Only the candidate of the interview can open it; the company and other
        users get 403.
      tags:
        - interviews
      parameters:
        - name: interviewId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The interview with its questions and answer progress
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      jobId:
                        type: string
                        format: uuid
                      mode:
                        type: string
                        enum:
                          - audio
                          - audio_video
                      status:
                        type: string
                        enum:
                          - pending
                          - ready
                          - invited
                          - failed
                      totalQuestions:
                        type: integer
                      answeredCount:
                        type: integer
                      nextQuestionId:
                        type: string
                        format: uuid
                        nullable: true
                      questions:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                            position:
                              type: integer
                            question:
                              type: string
                            answered:
                              type: boolean
                            recordedAt:
                              type: string
                              format: date-time
                              nullable: true
        "401":
          description: Not logged in
        "403":
          description: Not the candidate of this interview
        "404":
          description: Interview not found
      security:
        - bearerAuth: []
  /interviews/{interviewId}/transcripts:
    get:
      summary: Posting company reads the answer transcripts of an AI interview
      description: >-
        Returns each question of the interview with whether it has a recording and
        its transcript. A background job writes the transcript after the candidate uploads
        a recording; transcriptStatus is pending while it waits or retries, completed once
        saved, and failed when the recording is too long, unreadable or silent, or the
        retries ran out. Only members of the company that posted the job can read it; the
        candidate and other users get 403.
      tags:
        - interviews
      parameters:
        - name: interviewId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Each question with its recording state and transcript
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      interviewId:
                        type: string
                      questions:
                        type: array
                        items:
                          type: object
                          properties:
                            questionId:
                              type: string
                            position:
                              type: integer
                            question:
                              type: string
                            recorded:
                              type: boolean
                            transcriptStatus:
                              type: string
                              nullable: true
                              enum: [pending, completed, failed]
                            transcript:
                              type: string
                              nullable: true
                            transcribedAt:
                              type: string
                              format: date-time
                              nullable: true
        "401":
          description: Login required
        "403":
          description: Not a member of the company that posted the job
        "404":
          description: Interview not found
      security:
        - bearerAuth: []
