  /applications/{_id}:
    get:
      summary: ""
      tags:
        - applications
      parameters:
        - name: _id
          in: path
          required: true
          schema:
            type: string
      description: >-
        The candidate can read their own application; the job's company (and admins) can read
        any application for its jobs. Test scores and graded answers are only returned to the
        company, never to the candidate.
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      count:
                        type: number
                      application:
                        type: object
                        properties:
                          problemSolvingScore:
                            type: number
                            nullable: true
                            description: >-
                              Problem-solving result as a percentage (null until taken). Not sent to the candidate.
                          cultureFitScore:
                            type: number
                            nullable: true
                            description: >-
                              Culture-fit result as a percentage (null until taken). Not sent to the candidate.
                          source:
                            type: string
                            nullable: true
                            description: >-
                              Where the applicant's link came from (e.g. whatsapp, linkedin, indeed), lower-cased; null when the link carried none.
                          personalityFitScore:
                            type: number
                            nullable: true
                            description: >-
                              The AI's 0-100 judgement of how the applicant's personality (MBTI) fits this job, made right after the personality check (null until then, or if the AI call failed). Not sent to the candidate.
                          personalityFitReason:
                            type: string
                            nullable: true
                            description: >-
                              The AI's short reason for personalityFitScore. Not sent to the candidate.
                          personalityFitPending:
                            type: boolean
                            description: >-
                              True while the AI is working out the personality fit, so the page can wait instead of offering a retry. Not sent to the candidate.
                          problemSolvingAnswers:
                            description: Graded problem-solving answers, in the order asked. Company only.
                            type: array
                            items:
                              type: object
                              properties:
                                question:
                                  type: string
                                answer:
                                  type: string
                                score:
                                  type: number
                                  description: The AI's grade for this answer, 0-5.
                                maxScore:
                                  type: number
                                  example: 5
                                feedback:
                                  type: string
                                  description: One line on why it got that grade.
                          cultureFitAnswers:
                            description: Graded culture-fit answers, in the order asked. Company only.
                            type: array
                            items:
                              type: object
                              properties:
                                question:
                                  type: string
                                answer:
                                  type: string
                                score:
                                  type: number
                                  description: The AI's grade for this answer, 0-5.
                                maxScore:
                                  type: number
                                  example: 5
                                feedback:
                                  type: string
                                  description: One line on why it got that grade.
      security:
        - bearerAuth: []
