  /applications/{_id}:
    get:
      summary: ""
      tags:
        - applications
      parameters:
        - name: _id
          in: path
          required: true
          schema:
            type: string
      description: >-
        The candidate can read their own application; the job's company (and admins) can read
        any application for its jobs. Test scores and graded answers are only returned to the
        company, never to the candidate.
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      count:
                        type: number
                      application:
                        type: object
                        properties:
                          problemSolvingScore:
                            type: number
                            nullable: true
                            description: >-
                              Problem-solving result as a percentage (null until taken). Not sent to the candidate.
                          cultureFitScore:
                            type: number
                            nullable: true
                            description: >-
                              Culture-fit result as a percentage (null until taken). Not sent to the candidate.
                          source:
                            type: string
                            nullable: true
                            description: >-
                              Where the applicant's link came from (e.g. whatsapp, linkedin, indeed), lower-cased; null when the link carried none.
                          personalityFitScore:
                            type: number
                            nullable: true
                            description: >-
                              The AI's 0-100 judgement of how the applicant's personality (MBTI) fits this job, made right after the personality check (null until then, or if the AI call failed). Not sent to the candidate.
                          personalityFitReason:
                            type: string
                            nullable: true
                            description: >-
                              The AI's short reason for personalityFitScore. Not sent to the candidate.
                          personalityFitPending:
                            type: boolean
                            description: >-
                              True while the AI is working out the personality fit, so the page can wait instead of offering a retry. Not sent to the candidate.
                          nextStep:
                            type: string
                            enum: [ai_interview, shortlisted]
                            description: >-
                              What Move forward does next: ai_interview while the job runs a recorded interview and this candidate has none, otherwise shortlisted. Not sent to the candidate.
                          interview:
                            type: object
                            nullable: true
                            description: >-
                              The recorded AI interview, or null when there is none. Not sent to the candidate.
                              status is not_started, in_progress, processing or ready. Each question has
                              durationSeconds (length of the recording, null if it could not be measured) and
                              its transcript. Each flag is {text, question}, where question is the answer's
                              position, or null when the flag is about the whole interview.
                          problemSolvingAnswers:
                            description: Scored problem-solving answers, in the order asked. Company only. Multiple-choice answers also carry the options, the chosen option and the correct option; older written answers carry the AI's feedback.
                            type: array
                            items:
                              type: object
                              properties:
                                question:
                                  type: string
                                answer:
                                  type: string
                                score:
                                  type: number
                                  description: 5 for the correct option and 0 otherwise; older written answers have the AI's grade, 0-5.
                                maxScore:
                                  type: number
                                  example: 5
                                feedback:
                                  type: string
                                  nullable: true
                                  description: One line on why an older written answer got its grade.
                                options:
                                  type: array
                                  items:
                                    type: string
                                selectedOption:
                                  type: integer
                                  description: The option the candidate chose, from 0.
                                correctOption:
                                  type: integer
                                  description: The correct option, from 0.
                          cultureFitAnswers:
                            description: Scored culture-fit answers, in the order asked. Company only. Multiple-choice answers also carry the options, the chosen option and the correct option; older written answers carry the AI's feedback.
                            type: array
                            items:
                              type: object
                              properties:
                                question:
                                  type: string
                                answer:
                                  type: string
                                score:
                                  type: number
                                  description: 5 for the correct option and 0 otherwise; older written answers have the AI's grade, 0-5.
                                maxScore:
                                  type: number
                                  example: 5
                                feedback:
                                  type: string
                                  nullable: true
                                  description: One line on why an older written answer got its grade.
                                options:
                                  type: array
                                  items:
                                    type: string
                                selectedOption:
                                  type: integer
                                  description: The option the candidate chose, from 0.
                                correctOption:
                                  type: integer
                                  description: The correct option, from 0.
      security:
        - bearerAuth: []
  /applications/{_id}/status:
    patch:
      summary: Recruiter
      tags:
        - applications
      parameters:
        - name: _id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum:
                    - rejected
                    - shortlisted
                email:
                  type: object
                  description: >-
                    Only with a rejection. When send is true the body is saved in the recruiter's chat
                    with the candidate and emailed to them.
                  properties:
                    send:
                      type: boolean
                    body:
                      type: string
                      maxLength: 2000
              required:
                - status
