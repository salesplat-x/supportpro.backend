  /applications/{_id}/personality-fit:
    post:
      summary: Recruiter — retry the personality fit for an application
      description: >-
        Asks the AI again how the applicant's personality (MBTI) type fits the job, for when the automatic try after the personality test failed.
        Returns the existing fit without calling the AI if one is already saved. Only the job's company can call it.
      tags:
        - applications
      parameters:
        - name: _id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The saved personality fit
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      personalityFitScore:
                        type: number
                        description: The AI's 0-100 judgement of the fit.
                      personalityFitReason:
                        type: string
        "400":
          description: The candidate hasn't finished the personality test, or the test is switched off for this job.
        "403":
          description: The application belongs to another company.
        "404":
          description: Application not found.
        "409":
          description: The fit is already being worked out.
        "502":
          description: The AI call failed or gave an unusable reply (PERSONALITY_FIT_FAILED). Safe to retry.
      security:
        - bearerAuth: []
  /questions/candidate/problem-solving:
    get:
      summary: Candidate — load my problem-solving questions for a job
      description: >-
        For an applicant to a job whose problem-solving test is switched on. The first call picks the recruiter's chosen number of questions at random from the job's pool and keeps them on the application; later calls return the same set.
        Scoring criteria are never sent.
      tags:
        - questions
      parameters:
        - name: jobId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The candidate's questions
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      questions:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            question:
                              type: string
                            questionType:
                              type: string
        "400":
          description: Bad jobId, the test is not switched on for this job, or the candidate hasn't applied
        "401":
          description: Not logged in
        "403":
          description: Only candidates can load these questions
        "404":
          description: Job not found
        "409":
          description: The job has no problem-solving questions yet (the recruiter hasn't generated them)
      security:
        - bearerAuth: []
  /questions/candidate/culture-fit:
    get:
      summary: Candidate — load my culture-fit questions for a job
      description: >-
        For an applicant to a job whose culture-fit test is switched on. The first call picks the recruiter's chosen number of questions at random from the job's pool and keeps them on the application; later calls return the same set.
        Scoring criteria are never sent.
      tags:
        - questions
      parameters:
        - name: jobId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The candidate's questions
