  /questions/problem-solving:
    post:
      summary: Recruiter — generate problem-solving questions for a job
      description: >-
        Writes reasoning questions that suit any job; nothing about the job is sent to the AI. Only members of the company that owns the job may call it.
        Questions are saved on the job with a category and scoring criteria.
        A job holds at most 30 problem-solving questions.
      tags:
        - questions
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jobId:
                  type: string
                  format: uuid
                count:
                  type: integer
                  minimum: 1
                  maximum: 10
                  default: 5
                  description: How many questions to generate (capped by the 30-question pool).
              required:
                - jobId
      responses:
        "200":
          description: Questions generated and saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      questions:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            jobId:
                              type: string
                            type:
                              type: string
                              enum:
                                - problem_solving
                            question:
                              type: string
                            category:
                              type: string
                            criteria:
                              type: string
                              nullable: true
        "400":
          description: Invalid jobId or count, or the job's question pool is full
        "401":
          description: Login required
        "403":
          description: Not a recruiter, email not verified, or not a member of the job's company
        "404":
          description: Job not found
        "409":
          description: Another request saved the same questions while this one was generating; nothing was saved
        "502":
          description: The AI service gave no usable questions after a retry; nothing was saved
      security:
        - bearerAuth: []
  /questions/culture-fit:
    post:
      summary: Recruiter — generate culture-fit questions for a job
      description: >-
        Writes behavioural questions against the company's values (companyValues). With no values set it still answers, with general working-style questions. Only members of the company that owns the job may call it.
        Questions are saved on the job with a category and scoring criteria.
        A job holds at most 30 culture-fit questions.
      tags:
        - questions
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jobId:
                  type: string
                  format: uuid
                count:
                  type: integer
                  minimum: 1
                  maximum: 10
                  default: 5
                  description: How many questions to generate (capped by the 30-question pool).
              required:
                - jobId
      responses:
        "200":
          description: Questions generated and saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      questions:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            jobId:
                              type: string
                            type:
                              type: string
                              enum:
                                - culture_fit
                            question:
                              type: string
                            category:
                              type: string
                            criteria:
                              type: string
                              nullable: true
                      basedOnCompanyValues:
                        type: boolean
                        description: >-
                          false when the company has no values yet — the questions then
                          cover general ways of working.
        "400":
          description: Invalid jobId or count, or the job's question pool is full
        "401":
          description: Login required
        "403":
          description: Not a recruiter, email not verified, or not a member of the job's company
        "404":
          description: Job not found
        "409":
          description: Another request saved the same questions while this one was generating; nothing was saved
        "502":
          description: The AI service gave no usable questions after a retry; nothing was saved
      security:
        - bearerAuth: []
