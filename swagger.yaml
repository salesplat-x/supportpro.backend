            type: string
            enum:
              - by invitation
              - by application
        - name: applicationStatus
          in: query
          required: false
          schema:
            type: string
            enum:
              - pending
              - retake_assessment
              - not_proceeding
              - shortlisted
              - rejected
        - name: limit
          in: query
          required: false
          schema:
            type: number
        - name: offset
          in: query
          required: false
          schema:
            type: number
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
        - name: group
          in: query
          required: false
          description: Only applications that need the candidate, are in progress, or are closed. Paging applies after this filter.
          schema:
            type: string
            enum: [needs_you, in_progress, closed]
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      applications:
                        type: array
                        description: Each application also carries candidateStatus (interview_to_do, test_to_take, screening, shortlisted, applied, not_proceeding), group, currentStep, totalSteps and nextStep. Pass marks and hidden scores are never sent.
                        items:
                          type: object
                      total:
                        type: integer
                        description: Applications matching the filters, across all pages.
                      counts:
                        type: object
                        description: Applications in each group, ignoring the group filter.
                        properties:
                          all:
                            type: integer
                          needs_you:
                            type: integer
                          in_progress:
                            type: integer
                          closed:
                            type: integer
        "400":
          description: Bad query
        "401":
          description: Not logged in
        "403":
          description: Only talents can list their applications
      security:
        - bearerAuth: []
  /staff-invites/mine:
    get:
      summary: Talent — staff invites waiting for me
      description: Pending invites sent to the talent's own verified email, newest first. Expired and used invites are left out.
      tags:
        - staff
      responses:
        "200":
          description: The invites
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      invites:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            organizationName:
                              type: string
                            organizationLogoUrl:
                              type: string
                              nullable: true
                            jobTitle:
                              type: string
                              nullable: true
                            invitedByName:
                              type: string
                              nullable: true
                            expiresAt:
                              type: string
                              format: date-time
                              nullable: true
        "401":
          description: Not logged in
        "403":
          description: Only talents
      security:
        - bearerAuth: []
  /staff-invites/mine/{staffId}/accept:
    post:
      summary: Talent — accept a staff invite from My work
      description: Joins the company as staff. Same checks as the emailed link; only invites sent to the talent's own email are found.
      tags:
        - staff
      parameters:
        - name: staffId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Joined
        "400":
          description: Bad staffId, or the invite has expired or been used
        "401":
          description: Not logged in
        "403":
          description: Only talents, with a verified email
        "404":
          description: No pending invite for this talent
        "422":
          description: The talent's profile isn't complete yet
      security:
        - bearerAuth: []
  /user/dashboard:
    get:
      summary: Talent — my dashboard
      description: >-
        What the talent has applied to, the tests and interviews waiting for them, and what to do next, earliest due first.
      tags:
        - user
      responses:
        "200":
          description: The dashboard
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      applications:
                        type: object
                        properties:
                          sent:
                            type: integer
                          sentThisWeek:
                            type: integer
                            description: Applied in the last 7 days.
                      tests:
                        type: object
                        properties:
                          toTake:
                            type: integer
                          nextDueAt:
                            type: string
                            format: date-time
                            nullable: true
                      interviews:
                        type: object
                        properties:
                          toRecord:
                            type: integer
                          nextDueAt:
                            type: string
                            format: date-time
                            nullable: true
                      todo:
                        type: array
                        description: The current step of each application that needs the talent, earliest due first. Each step has the same shape as a pipeline step.
                        items:
                          type: object
                          properties:
                            applicationId:
                              type: string
                            jobId:
                              type: string
                            jobTitle:
                              type: string
                            company:
                              type: object
                              nullable: true
                              properties:
                                name:
                                  type: string
                                logoUrl:
                                  type: string
                                  nullable: true
                            step:
                              type: object
        "401":
          description: Not logged in
        "403":
          description: Only talents have this dashboard
      security:
        - bearerAuth: []
  /user/applications/{applicationId}/pipeline:
    get:
      summary: Talent — where one of my applications stands
      description: >-
        Every step of the application in order, with what is done, the one current step and what comes next.
        Settled stages are moved on first (a valid skills test score, a test already scored, a stage the recruiter switched off).
        Only the candidate who applied can read it; anyone else gets 404.
      tags:
        - user
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The application's steps
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      application:
                        type: object
                        properties:
                          id:
                            type: string
                          jobId:
                            type: string
                          status:
                            type: string
                          appliedAt:
                            type: string
                            format: date-time
                          candidateStatus:
                            type: string
                            enum:
                              [
                                interview_to_do,
                                test_to_take,
                                screening,
                                shortlisted,
                                applied,
                                not_proceeding,
                              ]
                          group:
                            type: string
                            enum: [needs_you, in_progress, closed]
                          job:
                            type: object
                            properties:
                              id:
                                type: string
                              title:
                                type: string
                              status:
                                type: string
                              workMode:
                                type: array
                                items:
                                  type: string
                              locationCity:
                                type: string
                                nullable: true
                              locationState:
                                type: string
                                nullable: true
                              locationCountry:
                                type: string
                                nullable: true
                              organization:
                                type: object
                                nullable: true
                                properties:
                                  id:
                                    type: string
                                  name:
                                    type: string
                                  logoUrl:
                                    type: string
                                    nullable: true
                      steps:
                        type: array
                        items:
                          type: object
                          properties:
                            key:
                              type: string
                              enum:
                                [
                                  applied,
                                  skills_test,
                                  cv_match,
                                  tailored,
                                  problem_solving,
                                  culture_fit,
                                  personality,
                                  ai_interview,
                                  references,
                                  company_review,
                                ]
                            state:
                              type: string
                              enum: [done, current, upcoming]
                            sentAt:
                              type: string
                              format: date-time
                              nullable: true
                            doneAt:
                              type: string
                              format: date-time
                              nullable: true
                            dueAt:
                              type: string
                              format: date-time
                              nullable: true
                              description: Only on the current step. Shown to the candidate, not enforced.
                            isNew:
                              type: boolean
                              description: A problem-solving or culture-fit test the candidate hasn't opened yet.
                            questionCount:
                              type: integer
                              nullable: true
                            minutes:
                              type: integer
                              nullable: true
                            score:
                              type: number
                              nullable: true
                              description: The candidate's own skills test score. Other test scores are never sent.
                            passed:
                              type: boolean
                              nullable: true
                            matchLabel:
                              type: string
                              enum: [strong, good, fair]
                              nullable: true
                            answersSent:
                              type: integer
                              nullable: true
                            retryAt:
                              type: string
                              format: date-time
                              nullable: true
                            interviewId:
                              type: string
                              nullable: true
                              description: Set once the recorded interview can be started.
                            refereeCount:
                              type: integer
                              nullable: true
                            maxReferees:
                              type: integer
                              nullable: true
                            outcome:
                              type: string
                              enum: [shortlisted, not_proceeding]
                              nullable: true
                      currentStep:
                        type: integer
                        nullable: true
                        description: The current step's position, from 1. Null once a decision is made.
                      totalSteps:
                        type: integer
                      nextStep:
                        nullable: true
                        description: The current step, the same shape as a step.
                        type: object
                        properties:
                          key:
                            type: string
                            enum:
                              [
                                applied,
                                skills_test,
                                cv_match,
                                tailored,
                                problem_solving,
                                culture_fit,
                                personality,
                                ai_interview,
                                references,
                                company_review,
                              ]
                          state:
                            type: string
                            enum: [done, current, upcoming]
                          sentAt:
                            type: string
                            format: date-time
                            nullable: true
                          doneAt:
                            type: string
                            format: date-time
                            nullable: true
                          dueAt:
                            type: string
                            format: date-time
                            nullable: true
                            description: Only on the current step. Shown to the candidate, not enforced.
                          isNew:
                            type: boolean
                            description: A problem-solving or culture-fit test the candidate hasn't opened yet.
                          questionCount:
                            type: integer
                            nullable: true
                          minutes:
                            type: integer
                            nullable: true
                          score:
                            type: number
                            nullable: true
                            description: The candidate's own skills test score. Other test scores are never sent.
                          passed:
                            type: boolean
                            nullable: true
                          matchLabel:
                            type: string
                            enum: [strong, good, fair]
                            nullable: true
                          answersSent:
                            type: integer
                            nullable: true
                          retryAt:
                            type: string
                            format: date-time
                            nullable: true
                          interviewId:
                            type: string
                            nullable: true
                            description: Set once the recorded interview can be started.
                          refereeCount:
                            type: integer
                            nullable: true
                          maxReferees:
                            type: integer
                            nullable: true
                          outcome:
                            type: string
                            enum: [shortlisted, not_proceeding]
                            nullable: true
        "400":
          description: Bad applicationId
        "401":
          description: Not logged in
        "403":
          description: Only talents can read their applications
        "404":
          description: No such application of yours
      security:
        - bearerAuth: []
